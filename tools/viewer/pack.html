<!doctype html>
<meta charset="utf-8" />
<title>Furniture pack viewer</title>
<style>html,body{margin:0;background:#cfd3d8}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// Contact sheet of every mesh in public/apartment/models/furniture.* with a flat colour per material role.
import * as THREE from 'three';
import { loadPack } from '/src/layouts/apartment/data.js';
const pack = await loadPack('/apartment/models/', 'furniture');
const names = Object.keys(pack.meshes);
const cols = 4, W = 400, H = 330, rows = Math.ceil(names.length / cols);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
r.setSize(cols * W, rows * H);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xcfd3d8);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.3));
const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(1, 2, 1.5); scene.add(dl);
const pal = {}; const cl = [0xe6194b, 0x3cb44b, 0x4363d8, 0xf58231, 0x911eb4, 0x46f0f0, 0xf032e6, 0xbcf60c, 0x9a6324, 0x800000];
let k = 0;
r.setScissorTest(true);
names.forEach((n, i) => {
  const g = new THREE.Group();
  for (const { material, geo } of pack.geometries(n)) {
    pal[material] ||= cl[k++ % cl.length];
    g.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: pal[material], roughness: 0.6, flatShading: true })));
  }
  const s = new THREE.Scene(); s.background = scene.background; s.add(...scene.children, g);
  const a = pack.meshes[n]; const size = new THREE.Vector3(a.max[0] - a.min[0], a.max[1], a.max[2] - a.min[2]);
  const c = new THREE.Vector3(0, size.y / 2, 0);
  const cam = new THREE.PerspectiveCamera(35, W / H, 0.01, 50);
  cam.position.copy(c).add(new THREE.Vector3(0.8, 0.9, 1.1).normalize().multiplyScalar(Math.max(size.x, size.y, size.z) * 2.4)); cam.lookAt(c);
  const x = (i % cols) * W, y = (rows - 1 - Math.floor(i / cols)) * H;
  r.setViewport(x, y, W, H); r.setScissor(x, y, W, H); r.render(s, cam);
  scene.add(...s.children.filter((o) => o.isLight));
});
window.__info = { names, pal: Object.fromEntries(Object.entries(pal).map(([m, c]) => [m, c.toString(16)])) };
window.__done = true;
</script>
